[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmind"
version = "0.1.0"
description = "Git-bound coding agent memory — makes your team's AI session reasoning permanent and searchable."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vansh Pruthi", email = "vanshpruthi@users.noreply.github.com" }]
keywords = ["ai", "developer-tools", "git", "llm", "memory", "rag", "code-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    # CLI
    "click>=8.1",
    "rich>=13.0",

    # Data models
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Code parsing
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",

    # Retrieval
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",

    # LLM
    "openai>=1.40",

    # Storage
    "aiosqlite>=0.20",

    # Utilities
    "python-dotenv>=1.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pylint>=3.0",
    "mypy>=1.10",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CrucialVansh/gitmind"
Repository = "https://github.com/CrucialVansh/gitmind.git"
Issues = "https://github.com/CrucialVansh/gitmind/issues"

[project.scripts]
gitmind = "gitmind.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitmind*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pylint.main]
py-version = "3.12"
ignore-paths = ["vscode-gitmind", "^\\.venv/"]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "import-outside-toplevel",
    "broad-exception-caught",
    "redefined-outer-name",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "protected-access",
    "no-value-for-parameter",
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
